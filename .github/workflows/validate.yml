name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public structure
        run: python tests/validate_scope.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
